<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo -->
  <circle cx="50" cy="50" r="48" fill="url(#circleGradient)" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Hoja principal -->
  <path d="M30 35 Q50 20 70 35 Q65 45 60 50 Q50 55 40 50 Q35 45 30 35 Z" fill="url(#leafGradient)"/>
  
  <!-- Hoja secundaria -->
  <path d="M35 40 Q45 30 55 40 Q52 47 50 50 Q48 47 45 50 Q42 47 35 40 Z" fill="#15803d"/>
  
  <!-- Tallo -->
  <rect x="48" y="50" width="4" height="15" fill="#16a34a" rx="2"/>
  
  <!-- Puntos de EcoPoints -->
  <circle cx="25" cy="25" r="3" fill="#fbbf24"/>
  <circle cx="75" cy="25" r="3" fill="#fbbf24"/>
  <circle cx="25" cy="75" r="3" fill="#fbbf24"/>
  <circle cx="75" cy="75" r="3" fill="#fbbf24"/>
  
  <!-- Texto "D" para Dario Montaño -->
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">D</text>
</svg>